spring.application.name=notificacao-service
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificacao-service

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=goon.spring.notificacao_service.messaging.PedidoCriadoEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=goon.spring.notificacao_service.messaging